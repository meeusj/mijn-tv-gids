name: TV-gids bijwerken
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          path: epg
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: epg
      - run: npm run grab --- --sites=vrt.be,vtm.be,tvgids.nl --output=../guide.xml --days=7
        working-directory: epg
      - run: sed -i 's/<tv date="\([^"]*\)">/<tv date="\1" generator-info-name="Belgische TV-gids">/' guide.xml
      - run: sed -i -e 's/channel="VRT1.be@HD"/channel="VRT1.be"/g' -e 's/channel="VRTCanvas.be@HD"/channel="VRTCanvas.be"/g' -e 's/channel="Ketnet.be@HD"/channel="Ketnet.be"/g' guide.xml
      - run: sed -i -e 's/id="Play4.be@SD"/id="Play4.be"/g' -e 's/channel="Play4.be@SD"/channel="Play4.be"/g' guide.xml
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
        continue-on-error: true
      - run: |
          rm -rf publish/.git
          mkdir -p publish
          mv guide.xml publish/guide.xml
          cd publish
          git init -q
          git checkout -B gh-pages
          git add guide.xml
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" commit -q -m "Update" --allow-empty
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
